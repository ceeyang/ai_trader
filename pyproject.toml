[project]
name = "ai-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ceeyang", email = "ceeyang2024@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=2.3.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
    "websockets>=17.3",
]

[project.scripts]
ai-trader = "ai_trader.cli:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 需要测试网 key",
    "network: 需要公网",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
